name: SysTorch Release

# 发版流水线（任务 #45 · docs/12 §四-线3「GitHub Release 便携分发」）
#
# 触发：
#   - push tag `v*`     → 发布门禁 → Windows Standalone + signed Android APK → GitHub Release
#   - workflow_dispatch → 干跑：构建产物但**不推 ghcr、不建 Release**（验流水线本身）
#
# 测试门禁不在本文件重复实现 —— 以 `workflow_call` 复用 ci.yml。
# Windows 上 `cargo test` 与 `cargo build` 同 target-dir 会撞文件锁，
# 故后端测试留在 ubuntu 的 ci.yml；Windows 顺序运行壳测试与构建，rs/ 与 src-tauri/
# 是两个互不相干的 Cargo 工程（各自 target 目录）→ 结构上不会撞锁。

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: '干跑校验用的版本号（不带 v）；留空则取 ui/package.json'
        required: false
        default: ''

# 最小权限：默认只读，发 Release / 推 ghcr 的 job 各自就地提权
permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  SYSTORCH_BUILD_REVISION: ${{ github.sha }}
  # Sidecar loses the target triple when packaged; it must differ from systorch.exe
  # （WiX ICE30 两组件同装一文件名 → MSI 失败），见 docs/deployment.md §9.4-2
  SIDECAR_TRIPLE: x86_64-pc-windows-msvc

jobs:
  # ── 1. 版本一致性门禁（防忘记 bump 五处版本号） ──────────────────
  meta:
    name: 版本门禁
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      publish: ${{ steps.v.outputs.publish }}
      prerelease: ${{ steps.v.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v4

      - name: 解析并校验版本号
        id: v
        shell: bash
        env:
          REQUESTED_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          if [ "$GITHUB_EVENT_NAME" = "push" ]; then
            VERSION="${GITHUB_REF_NAME#v}"
            PUBLISH=true
          else
            VERSION="$REQUESTED_VERSION"
            PUBLISH=false
          fi

          UI_VER=$(node -p "require('./ui/package.json').version")
          TAURI_VER=$(node -p "require('./src-tauri/tauri.conf.json').version")
          ANDROID_VER=$(node -p "require('./src-tauri/tauri.android.conf.json').version")
          RS_VER=$(grep -m1 '^version' rs/Cargo.toml | sed -E 's/.*"(.*)".*/\1/')
          SHELL_VER=$(grep -m1 '^version' src-tauri/Cargo.toml | sed -E 's/.*"(.*)".*/\1/')

          # 干跑未给版本 → 取 ui/package.json，并校验所有桌面/Android 版本字段
          if [ -z "$VERSION" ]; then VERSION="$UI_VER"; fi

          echo "tag/input : $VERSION"
          echo "ui        : $UI_VER"
          echo "tauri.conf: $TAURI_VER"
          echo "tauri.android.conf: $ANDROID_VER"
          echo "rs/Cargo  : $RS_VER"
          echo "shell/Cargo: $SHELL_VER"

          fail=0
          for pair in "ui:$UI_VER" "tauri.conf:$TAURI_VER" "tauri.android.conf:$ANDROID_VER" "rs/Cargo:$RS_VER" "shell/Cargo:$SHELL_VER"; do
            name="${pair%%:*}"; got="${pair#*:}"
            if [ "$got" != "$VERSION" ]; then
              echo "::error::$name 版本 $got ≠ 期望 $VERSION — 五处版本号必须同步（见 docs/RELEASE.md）"
              fail=1
            fi
          done
          [ "$fail" = "0" ] || exit 1

          # Release narrative gate: every version must explain purpose, user path,
          # comparison and boundaries in the matching changelog section.
          CHANGELOG="CHANGELOG.md"
          for marker in "## [$VERSION]" "用户叙事与对照场景" "起点" "问题" "操作" "结果" "对照" "边界"; do
            if ! grep -Fq "$marker" "$CHANGELOG"; then
              echo "::error::CHANGELOG.md 缺少 v$VERSION 发布叙事字段：$marker — 请补齐功能目的、用户路径、对照场景与边界（见 docs/RELEASE.md）"
              fail=1
            fi
          done
          [ "$fail" = "0" ] || exit 1

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "publish=$PUBLISH" >> "$GITHUB_OUTPUT"
          if [ "$VERSION" = "0.10.2" ] || [ "$VERSION" = "0.11.0" ] || [[ "$VERSION" == *-* ]]; then
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          fi

  # ── 2. 测试门禁（复用 ci.yml，不重复实现） ─────────────────────────
  gate:
    name: 测试门禁
    needs: meta
    uses: ./.github/workflows/ci.yml

  # ── 3. Windows 桌面（Tauri 2 · MSI + NSIS + 便携版） ──────────────
  windows:
    name: Windows 桌面
    needs: [meta, gate]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Rust 缓存（rs/ + src-tauri/ 两工程分键）
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            rs/target
            src-tauri/target
          key: ${{ runner.os }}-cargo-release-${{ hashFiles('rs/Cargo.lock', 'src-tauri/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-release-

      - name: npm ci
        run: npm ci --prefix ui

      # Windows Authenticode 由仓库变量 WINDOWS_SIGNING_REQUIRED 控制。
      # 默认 false：允许先发布未签名功能验证包；切为 true 后，缺少 PFX 会阻断发布。
      - name: 准备 Windows Authenticode 签名证书
        if: github.event_name == 'push' && vars.WINDOWS_SIGNING_REQUIRED == 'true'
        id: signing
        shell: pwsh
        env:
          WINDOWS_CERTIFICATE_BASE64: ${{ secrets.WINDOWS_CERTIFICATE_BASE64 }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:WINDOWS_CERTIFICATE_BASE64)) {
            throw 'Missing WINDOWS_CERTIFICATE_BASE64. Configure a publicly trusted Windows code-signing PFX before pushing a release tag.'
          }
          if ([string]::IsNullOrWhiteSpace($env:WINDOWS_CERTIFICATE_PASSWORD)) {
            throw 'Missing WINDOWS_CERTIFICATE_PASSWORD. The release tag is intentionally blocked instead of publishing unsigned Windows artifacts.'
          }
          $certificatePath = Join-Path $env:RUNNER_TEMP 'systorch-windows-release.pfx'
          & .\scripts\prepare-windows-signing.ps1 `
            -Base64Payload $env:WINDOWS_CERTIFICATE_BASE64 `
            -OutputPath $certificatePath
          if ($LASTEXITCODE -ne 0) { throw 'Failed to materialize the Windows signing certificate.' }
          "WINDOWS_CERTIFICATE_PATH=$certificatePath" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          'WINDOWS_SIGNING_ENABLED=true' | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          'enabled=true' | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: 标记 Windows 未签名状态
        if: steps.signing.outputs.enabled != 'true'
        shell: pwsh
        run: |
          'WINDOWS_SIGNING_ENABLED=false' | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          'Windows Authenticode signing is disabled by repository variable WINDOWS_SIGNING_REQUIRED; this artifact is unsigned.' | Out-File -FilePath windows-signing-status.txt -Encoding utf8

      # daemon 先构建 → 作为 sidecar 塞进 src-tauri/binaries/
      # （binaries/ 已 gitignore，fresh clone 必须这步，见 docs/deployment.md §9.2）
      # 命名必须带 target-triple（externalBin 约定），且**不可**与壳 bin 同名
      # （WiX ICE30 → MSI 失败，见 docs/deployment.md §9.4-2）
      - name: 构建 daemon（sidecar）
        run: cargo build --release --locked --manifest-path rs/Cargo.toml -p systorch-daemon

      - name: 签名 daemon（进入 sidecar 前）
        if: steps.signing.outputs.enabled == 'true'
        shell: pwsh
        env:
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: |
          & .\scripts\sign-windows-artifacts.ps1 `
            -Path 'rs/target/release/systorch-daemon.exe' `
            -CertificatePath $env:WINDOWS_CERTIFICATE_PATH `
            -CertificatePassword $env:WINDOWS_CERTIFICATE_PASSWORD `
            -MetadataPath "windows-signing-${{ needs.meta.outputs.version }}.json"
          if ($LASTEXITCODE -ne 0) { throw 'Windows daemon signing failed.' }

      - name: 放置 sidecar
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force src-tauri/binaries | Out-Null
          Copy-Item rs/target/release/systorch-daemon.exe `
            "src-tauri/binaries/systorch-daemon-${{ env.SIDECAR_TRIPLE }}.exe" -Force
          Get-ChildItem src-tauri/binaries

      # cargo test 编译 Tauri build script，它要求 ui/dist 已存在；fresh runner 不会继承 gate job 的产物。
      - name: 构建桌面测试所需 UI 资源
        run: npm run build --prefix ui

      - name: 桌面内核身份与产物解析回归
        run: cargo test --manifest-path src-tauri/Cargo.toml --locked

      # 先只构建壳，签名后再 bundle。这样 MSI/NSIS 内部的主 EXE 也来自已签名输入。
      - name: Tauri build 壳（暂不 bundle）
        working-directory: src-tauri
        run: npx --yes @tauri-apps/cli@2.11.5 build --no-bundle --ci --no-sign

      - name: 签名 Tauri 壳（bundle 前）
        if: steps.signing.outputs.enabled == 'true'
        shell: pwsh
        env:
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: |
          & .\scripts\sign-windows-artifacts.ps1 `
            -Path 'src-tauri/target/release/systorch.exe' `
            -CertificatePath $env:WINDOWS_CERTIFICATE_PATH `
            -CertificatePassword $env:WINDOWS_CERTIFICATE_PASSWORD `
            -MetadataPath "windows-signing-${{ needs.meta.outputs.version }}.json"
          if ($LASTEXITCODE -ne 0) { throw 'Windows Tauri shell signing failed.' }

      # 必须在 src-tauri/ 下跑：bundle 复用上一步已经构建并签名的壳。
      - name: Tauri bundle（nsis + msi）
        working-directory: src-tauri
        run: npx --yes @tauri-apps/cli@2.11.5 bundle --bundles nsis,msi --ci --no-sign

      - name: 签名 Windows 安装器
        if: steps.signing.outputs.enabled == 'true'
        shell: pwsh
        env:
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: |
          $version = '${{ needs.meta.outputs.version }}'
          $msi = @(Get-ChildItem src-tauri/target/release/bundle/msi -Filter "*_${version}_*.msi" -File)
          $nsis = @(Get-ChildItem src-tauri/target/release/bundle/nsis -Filter "*_${version}_*-setup.exe" -File)
          if ($msi.Count -ne 1 -or $nsis.Count -ne 1) { throw "Expected one MSI and one NSIS executable before signing; found MSI=$($msi.Count), NSIS=$($nsis.Count)." }
          & .\scripts\sign-windows-artifacts.ps1 `
            -Path @($msi[0].FullName, $nsis[0].FullName) `
            -CertificatePath $env:WINDOWS_CERTIFICATE_PATH `
            -CertificatePassword $env:WINDOWS_CERTIFICATE_PASSWORD `
            -MetadataPath "windows-signing-${version}.json"
          if ($LASTEXITCODE -ne 0) { throw 'Windows installer signing failed.' }

      - name: 组装同批便携运行目录并压缩
        shell: pwsh
        run: |
          $version = '${{ needs.meta.outputs.version }}'
          $msiPattern = '*_{0}_*.msi' -f $version
          $nsisPattern = '*_{0}_*-setup.exe' -f $version
          $msi = @(Get-ChildItem src-tauri/target/release/bundle/msi -Filter $msiPattern -File)
          $nsis = @(Get-ChildItem src-tauri/target/release/bundle/nsis -Filter $nsisPattern -File)
          if ($msi.Count -ne 1 -or $nsis.Count -ne 1) {
            throw "Expected one MSI and one NSIS artifact; found MSI=$($msi.Count), NSIS=$($nsis.Count)."
          }
          # The Cargo target cache also contains bundle outputs. Give each run/attempt
          # a fresh portable directory so a restored cache cannot trip the packager's
          # deliberate no-overwrite guard.
          $portable = "src-tauri/target/release/bundle/portable/systorch-${{ needs.meta.outputs.version }}-${{ github.run_id }}-${{ github.run_attempt }}"
          .\scripts\package-portable.ps1 -Destination $portable -MsiPath $msi[0].FullName -NsisPath $nsis[0].FullName
          # Build a separate one-file Tauri application from the same verified daemon/UI inputs.
          $standalone = "src-tauri/target/release/bundle/standalone/SysTorch-${{ needs.meta.outputs.version }}-windows-x64.exe"
          .\scripts\build-standalone.ps1 -PortableDirectory $portable -OutputPath $standalone

          if ($env:WINDOWS_SIGNING_ENABLED -eq 'true') {
            $signingPassword = $env:WINDOWS_CERTIFICATE_PASSWORD
            & .\scripts\sign-windows-artifacts.ps1 `
              -Path $standalone `
              -CertificatePath $env:WINDOWS_CERTIFICATE_PATH `
              -CertificatePassword $signingPassword `
              -MetadataPath "windows-signing-${{ needs.meta.outputs.version }}.json"
            if ($LASTEXITCODE -ne 0) { throw 'Windows Standalone signing failed.' }
          }

          # Compress only after every executable and installer has its final signature.
          $zip = "SysTorch-${{ needs.meta.outputs.version }}-portable-windows-x64.zip"
          Compress-Archive -Path (Join-Path $portable '*') -DestinationPath $zip -CompressionLevel Optimal
          Copy-Item -LiteralPath $standalone -Destination "SysTorch-${{ needs.meta.outputs.version }}-windows-x64.exe" -Force
          Get-FileHash -LiteralPath $zip -Algorithm SHA256
          Get-FileHash -LiteralPath $standalone -Algorithm SHA256

      - name: 上传 Windows 签名清单
        if: steps.signing.outputs.enabled == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: systorch-windows-signing-${{ needs.meta.outputs.version }}
          path: windows-signing-${{ needs.meta.outputs.version }}.json
          if-no-files-found: error

      - name: 上传安装包
        uses: actions/upload-artifact@v4
        with:
          name: systorch-windows-${{ needs.meta.outputs.version }}
          path: |
            src-tauri/target/release/bundle/msi/*_${{ needs.meta.outputs.version }}_x64_en-US.msi
            src-tauri/target/release/bundle/nsis/*_${{ needs.meta.outputs.version }}_x64-setup.exe
            SysTorch-${{ needs.meta.outputs.version }}-portable-windows-x64.zip
            SysTorch-${{ needs.meta.outputs.version }}-windows-x64.exe
            windows-signing-status.txt
          if-no-files-found: error

  # ── 4. Headless CLI（Linux/Windows；Termux 使用设备本机 cargo install） ──
  cli:
    name: CLI (${{ matrix.platform }})
    needs: [meta, gate]
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux-x64
            executable: rs/target/release/systorch-cli
          - os: windows-latest
            platform: windows-x64
            executable: rs/target/release/systorch-cli.exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: 构建 CLI
        run: cargo build --release --locked --manifest-path rs/Cargo.toml -p systorch-cli
      - name: 准备 CLI 产物
        shell: bash
        run: |
          mkdir -p dist
          cp "${{ matrix.executable }}" "dist/systorch-cli-${{ needs.meta.outputs.version }}-${{ matrix.platform }}${{ matrix.platform == 'windows-x64' && '.exe' || '' }}"
      - name: 上传 CLI
        uses: actions/upload-artifact@v4
        with:
          name: systorch-cli-${{ needs.meta.outputs.version }}-${{ matrix.platform }}
          path: dist/*
          if-no-files-found: error

  android:
    name: Android APK
    needs: [meta, gate]
    if: needs.meta.outputs.publish == 'true'
    permissions:
      contents: read
    uses: ./.github/workflows/android.yml
    with:
      ref: ${{ github.ref_name }}
      abi: aarch64
    secrets: inherit

  # ── 5. Docker 镜像（ghcr.io） ─────────────────────────────────────
  docker:
    name: Docker 镜像
    needs: [meta, gate]
    runs-on: ubuntu-latest
    outputs:
      image: ghcr.io/${{ steps.img.outputs.repo }}
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      # 干跑不推镜像 —— 只验 Dockerfile 能构建
      - name: 登录 ghcr.io
        if: needs.meta.outputs.publish == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 镜像名转小写（ghcr 要求）
        id: img
        shell: bash
        run: printf 'repo=%s\n' "$(printf '%s' "$GITHUB_REPOSITORY" | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - name: Build & push
        uses: docker/build-push-action@v6
        with:
          context: .
          build-args: SYSTORCH_BUILD_REVISION=${{ github.sha }}
          push: ${{ needs.meta.outputs.publish == 'true' }}
          tags: ghcr.io/${{ steps.img.outputs.repo }}:${{ needs.meta.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Update stable latest tag
        if: needs.meta.outputs.publish == 'true' && needs.meta.outputs.prerelease != 'true'
        shell: bash
        run: docker buildx imagetools create --tag "${{ steps.img.outputs.image }}:latest" "${{ steps.img.outputs.image }}:${{ needs.meta.outputs.version }}"

  # ── 6. GitHub Release（仅 tag 触发） ──────────────────────────────
  release:
    name: GitHub Release
    needs: [meta, windows, docker, cli, android]
    if: always() && needs.meta.outputs.publish == 'true' && needs.windows.result == 'success' && needs.docker.result == 'success' && needs.cli.result == 'success' && needs.android.result == 'success' && needs.android.outputs.apk_available == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: systorch-windows-${{ needs.meta.outputs.version }}
          path: windows-artifacts

      - uses: actions/download-artifact@v4
        with:
          name: systorch-android-aarch64
          path: android-artifacts

      - name: Stage the two public release assets
        shell: bash
        env:
          VERSION: ${{ needs.meta.outputs.version }}
        run: |
          set -euo pipefail
          mkdir -p release-assets
          windows="windows-artifacts/SysTorch-${VERSION}-windows-x64.exe"
          android="android-artifacts/SysTorch-${VERSION}-android-aarch64.apk"
          test -f "$windows"
          test -f "$android"
          cp "$windows" release-assets/
          cp "$android" release-assets/
          count=$(find release-assets -maxdepth 1 -type f | wc -l)
          test "$count" -eq 2
          sha256sum release-assets/*

      - name: 创建 Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: v${{ needs.meta.outputs.version }}
          prerelease: ${{ needs.meta.outputs.prerelease == 'true' }}
          generate_release_notes: false
          overwrite_files: true
          files: release-assets/*
          body_path: docs/releases/${{ needs.meta.outputs.version }}.md

      # A release created with GITHUB_TOKEN does not emit a follow-up release
      # workflow run. workflow_dispatch is the supported non-recursive exception.
      - name: Refresh GitHub Pages release metadata
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run pages.yml --repo "${{ github.repository }}" --ref main
