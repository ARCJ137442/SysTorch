# SysTorch Rust workspace. `jev-*` crates implement the public Jev protocol dialect.
#
# Structure:
#   crates/jev-protocol       — frozen Jev/SystemOne wire types (zero IO)
#   crates/jev-core           — routing DAG and adapter traits
#   crates/jev-adapters       — upstream decision-service adapters
#   crates/systorch-daemon    — SysTorch HTTP API, storage and routing assembly
#
# 常用命令（从仓库根执行）：
#   cargo test --manifest-path rs/Cargo.toml --workspace
#   cargo run   --manifest-path rs/Cargo.toml        # default-members 指向 daemon

[workspace]
resolver = "2"
members = ["crates/*"]
# 裸 `cargo run/build`（virtual manifest）默认只构建 daemon bin
default-members = ["crates/systorch-daemon"]

[workspace.package]
version = "0.12.0"
edition = "2021"
license = "MIT OR Apache-2.0"
repository = "https://github.com/ARCJ137442/SysTorch"

[workspace.dependencies]
# 内部 crate
jev-protocol = { path = "crates/jev-protocol", version = "0.12.0" }
jev-core = { path = "crates/jev-core", version = "0.12.0" }
jev-adapters = { path = "crates/jev-adapters", version = "0.12.0" }

# 外部 crate（版本与拆分前 rs 单包保持一致）
axum = "0.7"
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
clap = { version = "4", features = ["derive", "env"] }
toml = "0.8"
anyhow = "1"
thiserror = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
async-trait = "0.1"
tower-http = { version = "0.6", features = ["cors", "fs"] } # fs：#43 容器同源托管 ui/dist（ServeDir）
# A6：P1-3 wiremock 验收（workspace 级）；A8 起 daemon 集成基座同源复用
wiremock = "0.6"
# Phase 4: 数据库支持（服务入口配置 + 调用统计）
rusqlite = { version = "0.32", features = ["bundled"] }
tokio-rusqlite = "0.6"
sha2 = "0.10"
getrandom = "0.2"
futures-util = "0.3"
sysinfo = "0.30.13"
