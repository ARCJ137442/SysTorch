[package]
name = "jev-adapters"
description = "Jev-Switch 上游适配：Vercel AI Gateway + Laya + TypeSafe SystemOne"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
jev-protocol = { workspace = true }
jev-core = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
reqwest = { workspace = true }
async-trait = { workspace = true }

[target.'cfg(windows)'.dependencies]
# reqwest defaults are disabled for Rustls; explicitly restore Windows proxy
# discovery so upstream calls use the user's configured system proxy.
reqwest = { workspace = true, features = ["system-proxy"] }

[dev-dependencies]
tokio = { workspace = true, features = ["test-util"] }
wiremock = { workspace = true }
