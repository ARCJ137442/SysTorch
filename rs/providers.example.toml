# SysTorch example configuration
#
# New deployments prefer SYSTORCH_* variable names. Legacy JEV_* variables remain
# accepted for existing installs and scripts, but should not be copied into new examples.
# Configuration path order:
#   1. SYSTORCH_CONFIG (legacy JEV_SWITCH_CONFIG)
#   2. Existing ~/.jev-switch/providers.toml for an in-place upgrade
#   3. New ~/.systorch/providers.toml
#
# Relative paths are resolved from the launching process working directory; they are not
# relative to this file. Cargo workspace layout does not change that rule.
#
# Secrets:
#   - Keep providers.toml readable only by the current user.
#   - The UI and admin API return only masked API key state.
#   - Never paste real secrets into example files, logs, screenshots, or commits.
#
# This example enables Vercel and Laya, and includes disabled TypeSafe official
# and local-compatible samples. Local requests preserve unknown fields by default.
strip_unknown_fields = false
#
# ── 双态开关（#43 · docs/12 §一）────────────────────────────────────
# mode 只管鉴权，**不涉及上游拓扑**（拓扑不区分：以内核所在位置访问上游）。
#   mode = "local"   # 默认：loopback 免鉴权（非 loopback peer → 403 应用层兜底）
#   mode = "cloud"   # /v1 要 Bearer 调用 token，admin 要会话
# env override: SYSTORCH_MODE=local|cloud (legacy JEV_SWITCH_MODE also accepted)（非法值拒绝启动）。
# **运行时热切（零进程重启）**：PUT /v1/admin/mode {"mode":"cloud"}
#   —— 无密码首次激活 cloud 必须同请求带 admin_password（fail-closed 指引）。
#
# ── 监听地址（bind 与 mode 解耦 · ListenSupervisor 热 Rebind）────────
# 未配置 bind（默认）→ 成对默认随 mode：local=127.0.0.1:11435、cloud=0.0.0.0:11435；
# mode 翻转自动热 Rebind 到对端默认（local 对 LAN 内核级关端口）。
#   # bind = "0.0.0.0:11435"   # 显式 bind（或 env SYSTORCH_BIND (legacy JEV_BIND)）：恒绑此值，mode 翻转不动
#                              #   监听（rebind.skipped="explicit bind"），local 态由
#                              #   peer 403 兜底；运行时改址：PUT /v1/admin/listen
#                              #   {"addr":"ip:port"} 显式化 / {"addr":"auto"} 恢复成对默认
#
# cloud 态鉴权（可选；local 态忽略这两项）：
#   auth_tokens = ["tok-…"]        # /v1 调用 token（也可写 [[auth_tokens]] token="…"
#                                  #   或 env SYSTORCH_AUTH_TOKENS (legacy JEV_AUTH_TOKENS)=逗号分隔，env 优先）
#   admin_password = "…"           # admin 登录密码（明文 toml —— Q4=b 哲学，0600 文件；
#                                  #   env SYSTORCH_ADMIN_PASSWORD (legacy JEV_ADMIN_PASSWORD) 优先；UI 只见会话，永不见密码；
#                                  #   运行时热更：PUT /v1/admin/password（会话全废）——
#                                  #   cloud 忘密恢复 = 本机 loopback 一行 curl）
# 部署细节与风险块：docs/deployment.md。

[providers.vercel]
kind = "vercel"
base = "https://ai-gateway.vercel.sh/typesafe/v1/systemone"
# 明文 key（优先）示意：api_key = "sk-…"   ← 不写真实值；或改用下方 env
api_key_env = "AI_GATEWAY_API_KEY"
enabled = true

[providers.laya]
kind = "laya"
base = "http://127.0.0.1:18765/v1/systemone"
enabled = true

# TypeSafe official API. Enable after setting TYPESAFE_API_KEY.
# `base` is the complete endpoint URL, not just the host or `/v1` prefix.
[providers.typesafe]
kind = "typesafe"
base = "https://api.typesafe.ai/v1/systemone"
api_key_env = "TYPESAFE_API_KEY"
# Keep false: official TypeSafe currently accepts text/JSON state only.
forward_extensions = false
enabled = false

# A local model server can use the same adapter when it implements Jev
# `POST /v1/systemone`. Local compatible endpoints may omit api_key.
[providers.local-typesafe]
kind = "typesafe"
base = "http://127.0.0.1:8000/v1/systemone"
# loopback + local 模式默认允许扩展；显式配置仍可打开该 provider 的转发许可。
forward_extensions = false
enabled = false

# OpenRouter translates Jev decisions through structured JSON chat completions.
# [providers.openrouter]
# kind = "openrouter"
# base = "https://openrouter.ai/api/v1/chat/completions"
# models = ["openrouter/auto"]
# api_key_env = "OPENROUTER_API_KEY"
# enabled = false

# ── Router 段（旧式，兼容保留）：model id → upstream id ──────────────
# 每条 = 单条 match=exact 边（priority=0、on_error=next、sticky=none）。
# 调用方 POST {"model": "laya-english", ...} 即走 Laya
# 调用方 POST {"model": "typesafe-ai/jev", ...} 即走 Vercel
# —— 这两条映射的语义不因下方 [[routes]] 示例而改变（不同 left，互不冲突）。
[router]
"laya-english" = "laya"
"typesafe-ai/jev" = "vercel"
# 同一 Laya 提供商（同一地址 18765）下的更多模型 —— 一个 API 地址 = 一个提供商，
# 多 checkpoint = 同提供商不同模型（LM Studio 同款标准；见 docs/11-提供商与模型接口路由.md）。
# 服务端 scripts/laya_multi_server.py 按 model id 分派 english / multilingual / router。
"laya-multilingual" = "laya"
"laya-router" = "laya"

# Optional TypeSafe examples are disabled above until you configure the service.
# For model IDs available to your official account, set upstream_model explicitly.

# ── 模型路由 DAG（contracts/03 §2 [[routes]]）────────────────────────
# 示例一：对外 id "jev" 双候选（同模型可切换）——
#   p10 优先走 Vercel（改写上游 model 为 typesafe-ai/jev）；
#   Vercel retryable 错误先按 RetryPolicy 重试同一候选，耗尽后 failover；其他错误
#   则按 on_error=next 立即切到 p30 的 Laya（上游 model 改写为 laya-english）。
[[routes]]
left = "jev"
match = "exact"
right = "vercel"
upstream_model = "typesafe-ai/jev"
priority = 10
sticky = "session"
on_error = "next"

[[routes]]
left = "jev"
match = "exact"
right = "laya"
upstream_model = "laya-english"
priority = 30
on_error = "next"

# 示例二：前缀族 —— 调用方 POST {"model": "local/qwen", ...} 命中 Laya
# （match=prefix：left 去掉尾部 * 后作前缀比较；无 upstream_model = 沿用原 model）。
[[routes]]
left = "local/*"
match = "prefix"
right = "laya"
priority = 40
on_error = "next"

# 示例三：公共 id 落到「提供商内的模型接口」——
# "jev-zh" 经 upstream_model 改写为 Laya 提供商的多语言模型接口 laya-multilingual
# （路由终点 = (提供商, 模型) 二元组，不是裸提供商；见 docs/11-提供商与模型接口路由.md）。
[[routes]]
left = "jev-zh"
match = "exact"
right = "laya"
upstream_model = "laya-multilingual"
priority = 20
on_error = "next"

# Example official TypeSafe route; enable the provider and use an account model ID.
[[routes]]
left = "jev-typesafe"
match = "exact"
right = "typesafe"
upstream_model = "jev-latest"
priority = 20
on_error = "next"

# Example local SystemOne-compatible route; provider remains disabled until ready.
[[routes]]
left = "jev-local"
match = "exact"
right = "local-typesafe"
upstream_model = "jev-local"
priority = 20
on_error = "next"
