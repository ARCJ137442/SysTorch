# SysTorch desktop shell — separate Cargo project (not part of the rs workspace)
# to keep daemon and native-shell build targets isolated.
# 工作区及并行前端线互相干扰）。任务 #44 · docs/12 §四-线3。
#
# Shape: Tauri 2 shell (window + tray + single instance) + embedded SysTorch daemon.
# WebView loads the daemon-hosted UI on the local gateway origin.

[package]
name = "systorch-shell"
version = "0.12.0"
edition = "2021"
description = "SysTorch desktop and Android application"
license = "MIT OR Apache-2.0"
repository = "https://github.com/ARCJ137442/SysTorch"

[features]
default = []
standalone = ["dep:sha2", "tauri/custom-protocol"]
m1-preview = ["dep:log", "tauri/devtools"]

# Binary name aligns with the SysTorch Tauri product configuration.
[[bin]]
name = "systorch"
path = "src/main.rs"

[lib]
name = "systorch_shell"
path = "src/lib.rs"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png", "image-ico"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = { version = "0.10", optional = true }
log = { version = "0.4", optional = true }

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
# SysTorch uses exact-version singleton identities so tray-resident patch versions cannot
# capture launches of a newer UI. See the small local semver behavior patch in vendor/.
tauri-plugin-single-instance = { version = "2", features = ["semver"] }

[target.'cfg(target_os = "android")'.dependencies]
systorch-daemon = { path = "../rs/crates/systorch-daemon" }
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time"] }

[patch.crates-io]
tauri-plugin-single-instance = { path = "vendor/tauri-plugin-single-instance" }

[profile.release]
lto = true
codegen-units = 1
panic = "abort"
strip = true
