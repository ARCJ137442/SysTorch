# SysTorch desktop first-run provider template.
# The shell seeds this as providers.toml and never overwrites an existing file.
# New deployments prefer SYSTORCH_* names; old JEV_* names remain compatibility aliases.
# Canonical config paths: %APPDATA%/SysTorch/providers.toml and ~/.systorch/providers.toml.
# Existing %APPDATA%/jev-switch and ~/.jev-switch data remain readable for upgrades.
# SYSTORCH_CONFIG takes precedence; JEV_SWITCH_CONFIG is a legacy alias.
# Model-specific runtime paths and environment variables belong to the user's external scripts.
# This file contains no real secrets; provider API keys stay inside the daemon.
[providers.vercel]
kind = "vercel"
base = "https://ai-gateway.vercel.sh/typesafe/v1/systemone"
# 明文 key（优先）示意：api_key = "sk-…"   ← 不写真实值；或改用下方 env
api_key_env = "AI_GATEWAY_API_KEY"
enabled = true

[providers.laya]
kind = "laya"
base = "http://127.0.0.1:18765/v1/systemone"
enabled = true

# TypeSafe official SystemOne. Add an API key in Providers before enabling.
[providers.typesafe]
kind = "typesafe"
base = "https://api.typesafe.ai/v1/systemone"
models = ["jev-latest"]
enabled = false

# ── Router 段（旧式，兼容保留）：model id → upstream id ──────────────
# 每条 = 单条 match=exact 边（priority=0、on_error=next、sticky=none）。
# 调用方 POST {"model": "laya-english", ...} 即走 Laya
# 调用方 POST {"model": "typesafe-ai/jev", ...} 即走 Vercel
# —— 这两条映射的语义不因下方 [[routes]] 示例而改变（不同 left，互不冲突）。
[router]
"laya-english" = "laya"
"typesafe-ai/jev" = "vercel"
# 同一 Laya 提供商（同一地址 18765）下的更多模型 —— 一个 API 地址 = 一个提供商，
# 多 checkpoint = 同提供商不同模型（LM Studio 同款标准；见 docs/11-提供商与模型接口路由.md）。
# 服务端 scripts/laya_multi_server.py 按 model id 分派 english / multilingual / router。
"laya-multilingual" = "laya"
"laya-router" = "laya"

# ── 模型路由 DAG（contracts/03 §2 [[routes]]）────────────────────────
# 示例一：对外 id "jev" 双候选（同模型可切换）——
#   p10 优先走 Vercel（改写上游 model 为 typesafe-ai/jev）；
#   Vercel 429/5xx/超时/网络类可重试错误自动 failover 到 p30 的 Laya
#   （on_error=next；Laya 侧改写上游 model 为 laya-english）。
[[routes]]
left = "jev"
match = "exact"
right = "vercel"
upstream_model = "typesafe-ai/jev"
priority = 10
sticky = "session"
on_error = "next"

[[routes]]
left = "jev"
match = "exact"
right = "laya"
upstream_model = "laya-english"
priority = 30
on_error = "next"

# 示例二：前缀族 —— 调用方 POST {"model": "local/qwen", ...} 命中 Laya
# （match=prefix：left 去掉尾部 * 后作前缀比较；无 upstream_model = 沿用原 model）。
[[routes]]
left = "local/*"
match = "prefix"
right = "laya"
priority = 40
on_error = "next"

# 示例三：公共 id 落到「提供商内的模型接口」——
# "jev-zh" 经 upstream_model 改写为 Laya 提供商的多语言模型接口 laya-multilingual
# （路由终点 = (提供商, 模型) 二元组，不是裸提供商；见 docs/11-提供商与模型接口路由.md）。
[[routes]]
left = "jev-zh"
match = "exact"
right = "laya"
upstream_model = "laya-multilingual"
priority = 20
on_error = "next"

